<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact us - White Water Rafting</title>
    <meta name="description" content="Contact White Water Rafting for anything you need and we'll help you right away">
    <meta name="author" content="Efrain Graneros">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/image.jpg" alt="HTML Sample Logo" width="120" height="130">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Contact us</h1>
        <section class="contact-info">
            <h2>White Water Rafting Company. Send us a message</h2>
            <p>435 Main Sorocaba</p>
            <p>Sorocaba,Sao paulo</p>
            <p>+5 666 655 6564</p>
            <p>water@rafting.com</p>
        </section>
        <section class="employees">
            <h2>We are here to serve you</h2>

            <figure>
                <img src="images/hero.jpg" alt="Happy Employee" width="200">
                <figcaption>Peter - instructor</figcaption>
            </figure>
            <figure>
                <img src="images/employee.jpg" alt="Employee being focused" width="200">
                <figcaption>Jerry - kayak coach</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg" alt="Employee having fun" width="200">
                <figcaption>Margot - trip staff</figcaption>
            </figure>
        </section>
        <section class="contact-form">
            <h2>Please contact us</h2>
            <form>
                <label for="name">name:</label>
                <input type="text" id="name" name="name">

                <label for="email">email:</label>
                <input type="email" id="email" name="email">

                <p>purpose of message:</p>
                <label>
                    <input type="radio" id="purpose-general" name="purpose" value="general">
                    general inquiry
                </label>
                <label>
                    <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                    reservation question
                </label>
                <label>
                    <input type="radio" id="purpose-suggestion" name="purpose" value="suggestion">
                    website suggestion
                </label>
                <label for="message">message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <label>
                    <input type="checkbox" id="subscribe" name="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>
                <button type="submit">send a message</button>
            </form>
        </section>
        <div class="map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d9228.218383202702!2d-47.13165607867257!3d-23.38022309436921!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2sar!4v1794518120596!5m2!1ses!2sar" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
    </main>
    <footer>
        <p>©2026,🌊White Water Rafting🌊, Efrain Graneros</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon" width="40" height="100">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon" width="40" height="100">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon" width="40" height="100">
            </a>
        </nav>
    </footer>
</body>

</html>
